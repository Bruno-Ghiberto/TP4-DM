<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Drones - Análisis Comparativo</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Canvas para fondo animado tipo mallado -->
    <canvas id="particles-canvas"></canvas>
    
    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="title-section">
                    <h1 class="site-title">
                        <i class="fas fa-helicopter"></i>
                        ARKA DRONES
                    </h1>
                    <p class="site-subtitle">Tu guía definitiva para encontrar el drone perfecto</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Recommendation System -->
    <section class="recommendation-section">
        <div class="container">
            <div class="recommendation-container">
                <h2 class="recommendation-title">
                    <i class="fas fa-magic"></i>
                    ¿No sabes qué drone elegir? Te ayudamos
                </h2>
                <p class="recommendation-subtitle">Responde unas preguntas rápidas y te recomendaremos los mejores drones para ti</p>
                <button class="recommendation-btn" onclick="startRecommendation()">
                    <i class="fas fa-robot"></i>
                    Iniciar Asistente de Recomendación
                </button>
                <div id="recommendationQuiz" class="recommendation-quiz" style="display: none;">
                    <!-- Quiz content will be inserted here -->
                </div>
                <div id="recommendationResults" class="recommendation-results" style="display: none;">
                    <!-- Results will be inserted here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Filters Section -->
    <section class="filters-section">
        <div class="container">
            <div class="filters-grid">
                <!-- Brand Filter -->
                <div class="filter-group">
                    <label for="brandFilter">
                        <i class="fas fa-building"></i>
                        Marca
                    </label>
                    <select id="brandFilter" class="filter-select">
                        <option value="all">Todas las marcas</option>
                    </select>
                </div>

                <!-- Category Filter -->
                <div class="filter-group">
                    <label for="categoryFilter">
                        <i class="fas fa-tags"></i>
                        Categoría
                    </label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">Todas las categorías</option>
                    </select>
                </div>

                <!-- Search -->
                <div class="filter-group">
                    <label for="searchInput">
                        <i class="fas fa-search"></i>
                        Buscar
                    </label>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar drones...">
                </div>

                <!-- Sort -->
                <div class="filter-group">
                    <label for="sortSelect">
                        <i class="fas fa-sort"></i>
                        Ordenar por
                    </label>
                    <select id="sortSelect" class="filter-select">
                        <option value="name">Nombre</option>
                        <option value="score">Puntuación</option>
                        <option value="weight">Peso</option>
                        <option value="flightTime">Tiempo de vuelo</option>
                        <option value="range">Alcance</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Drone Grid -->
            <div id="droneGrid" class="drone-grid">
                <!-- Drone cards will be inserted here by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Drone Details Modal -->
    <div id="droneModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDroneName"></h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="modal-info">
                    <img id="modalDroneImage" src="" alt="Drone" class="modal-image">
                    <div class="modal-badges">
                        <span class="modal-badge" id="modalDroneBrand"></span>
                        <span class="modal-badge" id="modalDroneCategory"></span>
                        <span class="modal-score" id="modalDroneScore"></span>
                    </div>
                </div>
                <div id="modalDroneSpecs" class="modal-specs">
                    <!-- Specifications will be inserted here -->
                </div>
                <div class="modal-actions">
                    <a id="modalSourceLink" href="#" target="_blank" class="btn-primary">
                        <i class="fas fa-external-link-alt"></i>
                        Ver en sitio oficial
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 Catálogo de Drones - Proyecto de Web Scraping</p>
            <p>Datos actualizados: <span id="lastUpdate">Enero 2025</span></p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
    <script src="js/charts.js"></script>
</body>
</html>
